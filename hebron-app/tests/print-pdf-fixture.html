<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Vector print PDF acceptance fixture</title><style>body{font-family:system-ui}#reference{border:1px solid #999;width:900px;height:500px}</style></head>
<body>
  <h1>Vector print PDF acceptance fixture</h1>
  <p>Uses the production builder. PDFs must contain outline paths, not a full-page image.</p>
  <button id="vector">Generate vector only (90 x 50 mm)</button>
  <button id="mixed">Generate two-sided mixed (90 x 50 / 50 x 90 mm)</button>
  <button id="two-vector">Generate two vector-only sides</button>
  <button id="fallback">Generate resolved Arial alias</button>
  <button id="stretch">Export legacy frame defensively (85 x 170 mm)</button>
  <button id="all-fonts">Generate every local family with mixed scripts</button>
  <button id="legacy-load">Load legacy template then export immediately (85 x 170 mm)</button>
  <button id="checks">Run registry, glyph, layout and state checks</button>
  <button id="image">Generate image only (no masks/text)</button>
  <button id="clip">Generate circle image only</button>
  <button id="custom">Generate custom mask image only</button>
  <button id="svg">Generate vector SVG letterbox asset</button>
  <button id="bg-cover">Export background cover</button>
  <button id="bg-contain">Export background contain</button>
  <button id="bg-fill">Export background fill</button>
  <button id="bg-two">Export two-sided backgrounds</button>
  <button id="bg-svg">Export vector SVG background</button>
  <button id="bg-expanded">Export expanded surface with fixed background bounds</button>
  <button id="bg-real">Export calibrated legacy specimen (85 x 170 mm)</button>
  <button id="bg-missing">Reject missing background with actionable error</button>
  <button id="svg-style">Check unsupported SVG ID style error</button>
  <pre id="result" role="status">Ready</pre>
  <script>
    document.getElementById('result').textContent='HTML parsed; waiting for fixture module';
    window.addEventListener('error',event=>{document.getElementById('result').textContent=`GLOBAL ERROR: ${event.message} ${event.filename}:${event.lineno}`});
    window.addEventListener('unhandledrejection',event=>{document.getElementById('result').textContent=`UNHANDLED: ${event.reason?.stack || event.reason}`});
  </script>
  <h2>Konva reference (same scene/font, 900 x 500 cut-local pixels)</h2>
  <pre id="reference-status">Reference not started</pre>
  <div id="reference"></div>
  <script type="module">

            const w=data.background.backgroundSize==='fill'?frame.canvasSize.width:400*factor,h=data.background.backgroundSize==='fill'?frame.canvasSize.height:100*factor;
            context.drawImage(image,(frame.canvasSize.width-w)/2-frame.contentOffset.x,(frame.canvasSize.height-h)/2-frame.contentOffset.y,w,h);
            if(side==='front'){context.fillStyle='#d946ef';context.fillRect(20,20,30,30)}
          }
          document.getElementById('reference-status').textContent='Expected cut-local backgrounds: colored stripes / black center marker; magenta vector square at 20,20. Compare with generated PDF.';
        }
        if(mode==='bg-real') {
          value.sideFrames.front={...makeFrame(85,170,1893,3786),canvasSize:{width:2366,height:3941},contentOffset:{x:227,y:155}};
          value.frontData={objects:[
            text('legacy-mixed','한글 · Tiếng Việt Đặng Ắ · Vector',120,120,'700',{fontSize:75,size:{width:1650,height:180}}),
            {...shape('rectangle',0),id:'calibrated-square',position:{x:120,y:400},size:{width:500,height:500},strokeWidth:8},
            {...shape('circle',0),id:'calibrated-circle',position:{x:800,y:400},size:{width:500,height:500},fill:'#fdc976',strokeWidth:8},
            text('calibration-caption','500 × 500 canvas units = 22.45 × 22.45 mm',120,1050,'400',{fontSize:55,size:{width:1650,height:150}})
          ],background:{...background,backgroundImage:'https://hebron-storage.s3.ap-northeast-2.amazonaws.com/backgrounds/XyiQsbdyZ3taLKKDojgLxtPI8TncZh9A9hLoeuHN.jpg',backgroundSize:'fill',previewSize:{width:2366,height:2365}}};
          document.getElementById('reference-status').textContent='85×170 mm calibrated print region: 1893×3786 canvas units. Square and circle must both measure 22.45×22.45 mm. Original 2366×2365 background prints at its original bounds; expanded print surface must not stretch it.';
        }
        if(mode==='bg-expanded') {
          value.frontData.background.previewSize={width:800,height:600};
          value.sideFrames.front={...value.sideFrames.front,canvasSize:{width:800,height:1200},contentSize:{width:400,height:800},templateFrameConfig:{pageWidth:80,pageHeight:160,pageUnit:'mm'}};
        }
        const before = JSON.stringify(value);
        resultNode.textContent='Building vector PDF (font parsing, paths, SVG renderer)...';
        await new Promise(resolve=>setTimeout(resolve,50));
        const progress=[];
        const result = await buildPrintPdf(value,{onProgress:message=>{console.info('[Print PDF progress]',message);progress.push(message);resultNode.textContent=progress.join('\n')}});
        if (before !== JSON.stringify(value)) throw new Error('Builder mutated input state');
        resultNode.textContent = JSON.stringify({ status: 'PASS: input unchanged', bytes: result.blob.size, geometry: getPrintPageGeometry(value.sideFrames.front), warnings: result.warnings }, null, 2);
        downloadPrintPdf(result.blob, `print-fixture-${mode}.pdf`);
      } catch (error) { resultNode.textContent = mode==='bg-missing' && String(error).includes('배경') ? `PASS: missing background rejected: ${error.message}` : mode==='stretch' && String(error).includes('실제 인쇄 크기') ? `PASS: legacy mismatch blocked: ${error.message}` : mode==='svg-style' && String(error).includes('ID 스타일') ? `PASS: rejected unsupported SVG ID style with actionable message: ${error.message}` : `FAIL: ${error.stack || error}`; }
    };
    document.getElementById('result').textContent='Ready: click a button to load the production PDF module';
    renderReference().catch(error=>{document.getElementById('reference-status').textContent=`Reference FAIL: ${error.stack || error}`});
  </script>
</body></html>
