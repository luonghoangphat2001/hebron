stages:
  - deploy

variables:
  APP_DIR: "/var/www/hebron-api"

deploy_production:
  stage: deploy

  only:
    - develop

  tags:
    - hebron

  script:
    - echo "Deploy started..."

    - cd $APP_DIR

    - git checkout -- storage/api-docs/api-docs.yaml || true
    - sudo rm -f storage/api-docs/api-docs.yaml || rm -f storage/api-docs/api-docs.yaml || true
    - git clean -f -x -- storage/api-docs/api-docs.yaml || true

    - git pull origin develop

    - sudo chmod -R 775 storage bootstrap/cache || true

    - docker compose up -d --build app

    - docker compose exec -T app composer install --no-interaction --prefer-dist --optimize-autoloader

    - docker compose exec -T app php artisan migrate --force

    - docker compose exec -T app php artisan storage:link || true

    - docker compose exec -T app php artisan swagger:generate

    - docker compose exec -T app php artisan optimize:clear

    - docker compose exec -T app php artisan cache:clear

    - docker compose exec -T app php artisan config:cache

    - docker compose exec -T app php artisan route:cache

    - docker compose exec -T app php artisan event:cache

    - docker compose up -d --build --force-recreate queue reverb

    - echo "Deploy completed."
